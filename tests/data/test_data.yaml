# AIC CLI 测试数据
# 使用 __test_ 前缀标识测试数据，避免与真实数据冲突

skills:
  search_keyword: "test"
  # 用于测试的技能 ID（需要在测试前确认存在）
  # 如果服务器上没有测试技能，需要先创建或使用已知存在的技能
  existing_skill_id: 1

files:
  # 测试文件路径
  skill_md: "SKILL.md"
  # 测试用的旧内容和新内容
  test_old_content: "description: "
  test_new_content: "description: 测试更新描述"
